    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // Firebase Configuration (provided by environment)
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        // Visitor Counter Logic
        async function initVisitorCounter() {
            try {
                // RULE 3 - Auth Before Queries
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, async (user) => {
                    if (!user) return;

                    // RULE 1 - Strict Paths
                    const statsDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'visitorStats', 'counter');
                    
                    // Increment count
                    try {
                        const snap = await getDoc(statsDocRef);
                        if (!snap.exists()) {
                            await setDoc(statsDocRef, { count: 1 });
                        } else {
                            await updateDoc(statsDocRef, { count: increment(1) });
                        }
                    } catch (e) {
                        console.error("Counter update failed:", e);
                    }

                    // Listen for real-time updates
                    onSnapshot(statsDocRef, (docSnap) => {
                        if (docSnap.exists()) {
                            const count = docSnap.data().count;
                            document.getElementById('visitorCountDisplay').textContent = count.toLocaleString() + " ครั้ง";
                        }
                    }, (err) => console.error("Snapshot error:", err));
                });
            } catch (err) {
                console.error("Auth failed:", err);
                document.getElementById('visitorCountDisplay').textContent = "---";
            }
        }

        // Initialize counter
        initVisitorCounter();
    </script>

                elements.yearView.classList.add('hidden');
            } else {
                elements.yearBtn.classList.add('tab-active');
                elements.monthBtn.classList.remove('tab-active');
                elements.calendarView.classList.add('hidden');
                elements.yearView.classList.remove('hidden');
            }
            updateCalendarTitle();
            filterEvents();
        }

        function updateCalendarTitle() {
            elements.currentPeriod.textContent = currentView === 'month' 
                ? `${thaiMonths[currentDate.getMonth()]} ${currentDate.getFullYear() + 543}`
                : `ปี พ.ศ. ${currentDate.getFullYear() + 543}`;
        }

        function navigatePrevious() {
            if (currentView === 'month') currentDate.setMonth(currentDate.getMonth() - 1);
            else currentDate.setFullYear(currentDate.getFullYear() - 1);
            updateCalendarTitle();
            filterEvents();
        }

        function navigateNext() {
            if (currentView === 'month') currentDate.setMonth(currentDate.getMonth() + 1);
            else currentDate.setFullYear(currentDate.getFullYear() + 1);
            updateCalendarTitle();
            filterEvents();
        }

        async function fetchEvents() {
            showLoading(true);
            hideError();
            try {
                const response = await fetch(`${API_URL}?sheetId=${SHEET_ID}&sheetName=${SHEET_NAME}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                allEvents = processEvents(data);
                populateFilters();
                filterEvents();
            } catch (error) {
                showError(`ไม่สามารถดึงข้อมูลได้: ${error.message}`);
            } finally {
                showLoading(false);
            }
        }

        function processEvents(data) {
            return data.map(item => {
                const start = parseDate(item['วันที่เริ่มต้น']);
                const end = item['วันที่สิ้นสุด'] ? parseDate(item['วันที่สิ้นสุด']) : start;
                return {
                    id: Math.random().toString(36).substr(2, 9),
                    title: item['กิจกรรม'] || 'กิจกรรมไม่มีชื่อ',
                    startDate: start,
                    endDate: end,
                    time: item['เวลา'] || '',
                    location: item['สถานที่'] || '',
                    department: item['กลุ่มงาน'] || '',
                    person: item['ผู้รับผิดชอบ'] || '',
                    details: item['รายละเอียด'] || '',
                    additionalInfo: item['ข้อมูลเพิ่มเติม'] || '',
                    color: getDepartmentColor(item['กลุ่มงาน'])
                };
            }).filter(ev => ev.startDate);
        }

        function parseDate(dateStr) {
            if (!dateStr) return null;
            if (dateStr.includes('T')) {
                const d = new Date(dateStr);
                return new Date(d.getFullYear(), d.getMonth(), d.getDate());
            }
            const parts = dateStr.split(/[-/]/);
            if (parts.length === 3) {
                let y = parseInt(parts[0].length === 4 ? parts[0] : parts[2]);
                let m = parseInt(parts[0].length === 4 ? parts[1] : parts[1]) - 1;
                let d = parseInt(parts[0].length === 4 ? parts[2] : parts[0]);
                if (y > 2500) y -= 543;
                return new Date(y, m, d);
            }
            const fallback = new Date(dateStr);
            return isNaN(fallback.getTime()) ? null : fallback;
        }

        function populateFilters() {
            const persons = [...new Set(allEvents.map(e => e.person).filter(Boolean))].sort();
            const depts = [...new Set(allEvents.map(e => e.department).filter(Boolean))].sort();
            elements.personFilter.innerHTML = '<option value="">ทั้งหมด</option>' + persons.map(p => `<option value="${p}">${p}</option>`).join('');
            elements.deptFilter.innerHTML = '<option value="">ทั้งหมด</option>' + depts.map(d => `<option value="${d}">${d}</option>`).join('');
        }

        function filterEvents() {
            const title = elements.titleFilter.value.toLowerCase();
            const person = elements.personFilter.value;
            const dept = elements.deptFilter.value;
            let filtered = allEvents.filter(ev => {
                const matchSearch = (!title || ev.title.toLowerCase().includes(title)) && (!person || ev.person === person) && (!dept || ev.department === dept);
                if (currentView === 'month') {
                    const viewM = currentDate.getMonth();
                    const viewY = currentDate.getFullYear();
                    const evStart = ev.startDate;
                    const evEnd = ev.endDate;
                    const inMonth = (evStart.getMonth() === viewM && evStart.getFullYear() === viewY) || (evEnd.getMonth() === viewM && evEnd.getFullYear() === viewY) || (evStart <= new Date(viewY, viewM, 1) && evEnd >= new Date(viewY, viewM + 1, 0));
                    return matchSearch && inMonth;
                }
                return matchSearch && ev.startDate.getFullYear() === currentDate.getFullYear();
            });
            elements.eventCountBadge.textContent = `${filtered.length} รายการ`;
            renderEventsList(filtered);
            if (currentView === 'month') renderMonthCalendar(filtered);
            else renderYearCalendar(filtered);
        }

        function renderMonthCalendar(events) {
            elements.calendarDays.innerHTML = '';
            const y = currentDate.getFullYear();
            const m = currentDate.getMonth();
            const first = new Date(y, m, 1).getDay();
            const last = new Date(y, m + 1, 0).getDate();
            for (let i = 0; i < first; i++) {
                const empty = document.createElement('div');
                empty.className = 'calendar-day bg-gray-50/50';
                elements.calendarDays.appendChild(empty);
            }
            for (let d = 1; d <= last; d++) {
                const date = new Date(y, m, d);
                const dayEvents = events.filter(ev => date >= ev.startDate && date <= ev.endDate);
                const cell = document.createElement('div');
                cell.className = `calendar-day p-2 border-r border-b border-gray-100 ${dayEvents.length > 0 ? 'has-event' : ''}`;
                const header = document.createElement('div');
                header.className = 'flex justify-between items-start';
                header.innerHTML = `<span class="font-bold text-xl text-gray-700">${d}</span>`;
                if (dayEvents.length > 0) {
                    header.innerHTML += `<span class="text-xs bg-red-600 text-white rounded-full w-6 h-6 flex items-center justify-center font-bold">${dayEvents.length}</span>`;
                }
                cell.appendChild(header);
                const list = document.createElement('div');
                list.className = 'mt-2 space-y-1';
                dayEvents.slice(0, 2).forEach(ev => {
                    const item = document.createElement('div');
                    item.className = 'text-[12px] font-medium truncate px-1.5 py-0.5 rounded border-l-4 cursor-pointer hover:bg-white transition-colors';
                    item.style.borderLeftColor = ev.color;
                    item.style.backgroundColor = `${ev.color}15`;
                    item.textContent = ev.title;
                    item.onclick = (e) => { e.stopPropagation(); showEventDetails(ev); };
                    list.appendChild(item);
                });
                if (dayEvents.length > 2) {
                    const more = document.createElement('div');
                    more.className = 'text-[11px] text-center text-gray-400 font-bold mt-1';
                    more.textContent = `+ อีก ${dayEvents.length - 2}`;
                    list.appendChild(more);
                }
                cell.appendChild(list);
                elements.calendarDays.appendChild(cell);
            }
        }

        function renderYearCalendar(events) {
            elements.yearView.innerHTML = '';
            const y = currentDate.getFullYear();
            for (let m = 0; m < 12; m++) {
                const container = document.createElement('div');
                container.className = 'bg-white rounded-2xl p-4 shadow-sm border border-gray-100 hover:border-yellow-200 transition-all cursor-pointer';
                container.onclick = () => { currentDate.setMonth(m); switchView('month'); };
                const header = document.createElement('div');
                header.className = 'text-center font-bold text-red-600 mb-3 border-b pb-2';
                header.textContent = thaiMonths[m];
                container.appendChild(header);
                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-7 gap-1 text-[10px] text-center';
                ['อ', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'].forEach(d => {
                    const dh = document.createElement('div');
                    dh.className = 'text-gray-400 font-bold';
                    dh.textContent = d;
                    grid.appendChild(dh);
                });
                const first = new Date(y, m, 1).getDay();
                const last = new Date(y, m + 1, 0).getDate();
                for (let i = 0; i < first; i++) grid.appendChild(document.createElement('div'));
                for (let d = 1; d <= last; d++) {
                    const date = new Date(y, m, d);
                    const hasEv = events.some(ev => date >= ev.startDate && date <= ev.endDate);
                    const day = document.createElement('div');
                    day.className = `py-1 rounded-full ${hasEv ? 'bg-yellow-400 text-red-900 font-black' : 'text-gray-600'}`;
                    day.textContent = d;
                    grid.appendChild(day);
                }
                container.appendChild(grid);
                elements.yearView.appendChild(container);
            }
        }

        function renderEventsList(events) {
            elements.eventsList.innerHTML = '';
            if (events.length === 0) {
                elements.eventsList.innerHTML = '<div class="text-center py-10 text-gray-400">ไม่พบกิจกรรมในช่วงเวลานี้</div>';
                return;
            }
            const sorted = [...events].sort((a, b) => a.startDate - b.startDate);
            sorted.forEach(ev => {
                const item = document.createElement('div');
                item.className = 'event-item p-4 rounded-xl flex flex-col md:flex-row md:items-center justify-between cursor-pointer';
                item.onclick = () => showEventDetails(ev);
                item.innerHTML = `
                    <div class="flex items-center">
                        <div class="mr-4 text-center min-w-[60px]">
                            <div class="text-xs font-bold text-gray-400 uppercase">${thaiMonths[ev.startDate.getMonth()].substring(0, 3)}</div>
                            <div class="text-2xl font-black text-red-600">${ev.startDate.getDate()}</div>
                        </div>
                        <div>
                            <h4 class="font-bold text-gray-800 text-lg">${ev.title}</h4>
                            <div class="flex flex-wrap gap-2 mt-1">
                                <span class="text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-500 font-bold">${ev.department}</span>
                                ${ev.location ? `<span class="text-xs text-gray-400">📍 ${ev.location}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="mt-3 md:mt-0 text-right">
                        <div class="text-sm font-bold text-gray-700">${ev.person}</div>
                        <div class="text-xs text-gray-400">${ev.time || 'ตลอดวัน'}</div>
                    </div>
                `;
                elements.eventsList.appendChild(item);
            });
        }

        function showEventDetails(ev) {
            const cat = document.getElementById('modalCategory');
            cat.textContent = ev.department;
            cat.style.backgroundColor = `${ev.color}15`;
            cat.style.color = ev.color;
            elements.modalContent.innerHTML = `
                <h3 class="text-3xl font-black text-gray-800 mb-4 leading-tight">${ev.title}</h3>
                <div class="space-y-4 text-gray-600">
                    <div class="flex items-center"><div class="w-10 h-10 bg-red-50 rounded-xl flex items-center justify-center mr-4 text-red-600"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg></div><div><p class="text-xs font-bold text-gray-400 uppercase">วันที่จัดกิจกรรม</p><p class="font-bold text-lg">${ev.startDate.getDate()} ${thaiMonths[ev.startDate.getMonth()]} ${ev.startDate.getFullYear() + 543} ${ev.startDate.getTime() !== ev.endDate.getTime() ? ' - ' + ev.endDate.getDate() + ' ' + thaiMonths[ev.endDate.getMonth()] : ''}</p></div></div>
                    ${ev.time ? `<div class="flex items-center"><div class="w-10 h-10 bg-yellow-50 rounded-xl flex items-center justify-center mr-4 text-yellow-600"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg></div><div><p class="text-xs font-bold text-gray-400 uppercase">เวลา</p><p class="font-bold">${ev.time}</p></div></div>` : ''}
                    ${ev.location ? `<div class="flex items-center"><div class="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center mr-4 text-blue-600"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg></div><div><p class="text-xs font-bold text-gray-400 uppercase">สถานที่</p><p class="font-bold">${ev.location}</p></div></div>` : ''}
                    <div class="flex items-center"><div class="w-10 h-10 bg-purple-50 rounded-xl flex items-center justify-center mr-4 text-purple-600"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg></div><div><p class="text-xs font-bold text-gray-400 uppercase">ผู้รับผิดชอบ</p><p class="font-bold">${ev.person || 'ไม่ระบุ'}</p></div></div>
                    ${ev.details ? `<div class="mt-6 p-4 bg-gray-50 rounded-2xl border-l-4 border-red-600"><p class="text-xs font-bold text-gray-400 mb-1">รายละเอียดกิจกรรม</p><p class="text-gray-700 leading-relaxed">${ev.details}</p></div>` : ''}
                    ${ev.additionalInfo ? `<div class="mt-4 p-4 bg-yellow-50 rounded-2xl border-l-4 border-yellow-400"><p class="text-xs font-bold text-yellow-600 mb-1">ข้อมูลเพิ่มเติม</p><p class="text-gray-700 leading-relaxed">${ev.additionalInfo}</p></div>` : ''}
                </div>
            `;
            elements.modal.classList.remove('hidden');
        }

        function hideModal() { elements.modal.classList.add('hidden'); }
        function showLoading(show) { elements.loading.classList.toggle('hidden', !show); }
        function showError(msg) { elements.errorText.textContent = msg; elements.errorDiv.classList.remove('hidden'); }
        function hideError() { elements.errorDiv.classList.add('hidden'); }
        window.onload = init;
    </script>
</body>
</html>
