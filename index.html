    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // --- Firebase Config ---
        const myFirebaseConfig = {
            apiKey: "AIzaSyAl7gS91aKbKAbtY8kdvXjYwXv3VsMIoHE",
            authDomain: "count-calendar-d9fe4.firebaseapp.com",
            projectId: "count-calendar-d9fe4",
            storageBucket: "count-calendar-d9fe4.firebasestorage.app",
            messagingSenderId: "247367011900",
            appId: "1:247367011900:web:193e3612fa87a61380fd39"
        };

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : myFirebaseConfig;
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'wmk-school-calendar';

        async function initVisitorCounter() {
            const display = document.getElementById('visitorCountDisplay');
            const initAuth = async () => {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch (error) { console.error("Authentication failed:", error); }
            };
            await initAuth();
            onAuthStateChanged(auth, async (user) => {
                if (!user) return;
                const statsDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'visitorStats', 'counter');
                try {
                    const snap = await getDoc(statsDocRef);
                    if (!snap.exists()) await setDoc(statsDocRef, { count: 1 });
                    else await updateDoc(statsDocRef, { count: increment(1) });
                } catch (e) { console.error("Firestore Error:", e); }
                onSnapshot(statsDocRef, (docSnap) => {
                    if (docSnap.exists() && display) display.textContent = docSnap.data().count.toLocaleString() + " ครั้ง";
                });
            });
        }
        window.addEventListener('DOMContentLoaded', initVisitorCounter);
    </script>

    <script>
        const apiKey = "AIzaSyBDDum3ojnhCSrE2jLKIKjxwWuPWJ-iqSo";
        let currentAudio = null;

        async function speakText(text) {
            const speakBtn = document.getElementById('speakBtn');
            if (!text || speakBtn.classList.contains('loading')) return;

            if (currentAudio) { currentAudio.pause(); currentAudio = null; }

            speakBtn.classList.add('loading');
            const prompt = `อ่านออกเสียงข้อมูลกิจกรรมดังนี้ด้วยสำเนียงไทยที่เป็นธรรมชาติ: ${text}`;

            const fetchWithRetry = async (url, options, retries = 5, delay = 1000) => {
                for (let i = 0; i < retries; i++) {
                    try {
                        const response = await fetch(url, options);
                        if (response.ok) return response;
                        if (response.status !== 429 && response.status < 500) throw new Error(`HTTP Error: ${response.status}`);
                    } catch (err) {
                        if (i === retries - 1) throw err;
                    }
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2;
                }
            };

            try {
                const response = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Aoede" } } }
                        },
                        model: "gemini-2.5-flash-preview-tts"
                    })
                });

                const result = await response.json();
                const audioPart = result.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
                if (!audioPart) throw new Error("No audio data");

                const base64Audio = audioPart.inlineData.data;
                const sampleRate = parseInt(audioPart.inlineData.mimeType.match(/rate=(\d+)/)?.[1] || "24000");

                const pcmBuffer = base64ToArrayBuffer(base64Audio);
                const wavBlob = pcmToWav(pcmBuffer, sampleRate);
                const audioUrl = URL.createObjectURL(wavBlob);

                currentAudio = new Audio(audioUrl);
                currentAudio.onended = () => speakBtn.classList.remove('loading');
                currentAudio.play();
            } catch (error) {
                console.error("TTS Error:", error);
                speakBtn.classList.remove('loading');
            }
        }

        function pcmToWav(pcmBuffer, sampleRate) {
            const len = pcmBuffer.byteLength;
            const buffer = new ArrayBuffer(44 + len);
            const view = new DataView(buffer);
            const writeStr = (v, o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
            writeStr(view, 0, 'RIFF'); view.setUint32(4, 36 + len, true); writeStr(view, 8, 'WAVE');
            writeStr(view, 12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
            view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true);
            view.setUint16(34, 16, true); writeStr(view, 36, 'data'); view.setUint32(40, len, true);
            new Uint8Array(buffer, 44).set(new Uint8Array(pcmBuffer));
            return new Blob([buffer], { type: 'audio/wav' });
        }

        function base64ToArrayBuffer(base64) {
            const binary = window.atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes.buffer;
        }

        let allEvents = [];
        let currentDate = new Date();
        let currentView = 'month';
        const API_URL = 'https://script.google.com/macros/s/AKfycbwSDSgqEY2wfnl1rkp7fN5ua97R5KhAffwGZy36j0P0Imrdlx8n8o6tMzd5AS6Xm6Tb/exec';
        const SHEET_ID = '1VVC90lX-Yp8WROvNZvcl3cGvLKu2rssYBuCNm89LZXc';
        const SHEET_NAME = '2569';
        const thaiMonths = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
        let elements = {};

        function setupUI() {
            elements = {

                deptFilter: document.getElementById('departmentFilter'),
                modal: document.getElementById('eventModal'),
                closeModal: document.getElementById('closeModal'),
                closeModalBtn: document.getElementById('closeModalBtn'),
                modalContent: document.getElementById('modalContent'),
                speakBtn: document.getElementById('speakBtn')
            };
            elements.monthBtn.onclick = () => switchView('month');
            elements.yearBtn.onclick = () => switchView('year');
            elements.prevBtn.onclick = navigatePrevious;
            elements.nextBtn.onclick = navigateNext;

            elements.titleFilter.onkeypress = (e) => { if (e.key === 'Enter') filterEvents(); };

        }

        function closeEventModal() {

        }

        function getDepartmentColor(dept) {
            const colors = { 'กลุ่มงานวิชาการ': '#d32f2f', 'กลุ่มงานงบประมาณ': '#15803d', 'กลุ่มงานบุคคล': '#7e22ce', 'กลุ่มงานบริหารทั่วไป': '#d97706', 'กลุ่มงานกิจการ': '#1d4ed8' };
            return colors[dept?.trim()] || '#d32f2f';
        }

        async function fetchEvents() {
            elements.loading.classList.remove('hidden');
            try {
                const response = await fetch(`${API_URL}?sheetId=${SHEET_ID}&sheetName=${SHEET_NAME}`);
                const data = await response.json();
                allEvents = data.map(item => {
                    const start = parseDate(item['วันที่เริ่มต้น']);
                    return {
                        id: Math.random().toString(36).substr(2, 9),
                        title: item['กิจกรรม'] || 'กิจกรรมไม่มีชื่อ',
                        startDate: start,
                        endDate: item['วันที่สิ้นสุด'] ? parseDate(item['วันที่สิ้นสุด']) : start,
                        time: item['เวลา'] || '',
                        location: item['สถานที่'] || '',
                        department: item['กลุ่มงาน'] || '',
                        person: item['ผู้รับผิดชอบ'] || '',
                        details: item['รายละเอียด'] || '',
                        additionalInfo: item['ข้อมูลเพิ่มเติม'] || '',
                        color: getDepartmentColor(item['กลุ่มงาน'])
                    };
                }).filter(ev => ev.startDate);
                populateFilters(); filterEvents();
            } catch (error) { console.error(error); }
            elements.loading.classList.add('hidden');
        }

        function parseDate(dateStr) {
            if (!dateStr) return null;
            if (dateStr.includes('T')) { const d = new Date(dateStr); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
            const parts = dateStr.split(/[-/]/);
            if (parts.length === 3) {
                let y = parseInt(parts[0].length === 4 ? parts[0] : parts[2]);
                if (y > 2500) y -= 543;
                return new Date(y, parseInt(parts[1]) - 1, parseInt(parts[0].length === 4 ? parts[2] : parts[0]));
            }
            return new Date(dateStr);
        }

        function populateFilters() {
            const persons = [...new Set(allEvents.map(e => e.person).filter(Boolean))].sort();
            const depts = [...new Set(allEvents.map(e => e.department).filter(Boolean))].sort();
            elements.personFilter.innerHTML = '<option value="">ทั้งหมด</option>' + persons.map(p => `<option value="${p}">${p}</option>`).join('');
            elements.deptFilter.innerHTML = '<option value="">ทั้งหมด</option>' + depts.map(d => `<option value="${d}">${d}</option>`).join('');
        }

        function filterEvents() {
            const title = elements.titleFilter.value.toLowerCase(), person = elements.personFilter.value, dept = elements.deptFilter.value;
            const filtered = allEvents.filter(ev => {
                const match = (!title || ev.title.toLowerCase().includes(title)) && (!person || ev.person === person) && (!dept || ev.department === dept);
                if (currentView === 'month') { const m = currentDate.getMonth(), y = currentDate.getFullYear(); return match && ((ev.startDate.getMonth() === m && ev.startDate.getFullYear() === y) || (ev.endDate.getMonth() === m && ev.endDate.getFullYear() === y)); }
                return match && ev.startDate.getFullYear() === currentDate.getFullYear();
            });
            elements.eventCountBadge.textContent = `${filtered.length} รายการ`;
            renderEventsList(filtered);
            if (currentView === 'month') renderMonthCalendar(filtered); else renderYearCalendar(filtered);
        }

        function renderMonthCalendar(events) {
            elements.calendarDays.innerHTML = '';
            const y = currentDate.getFullYear(), m = currentDate.getMonth();
            const first = new Date(y, m, 1).getDay(), last = new Date(y, m + 1, 0).getDate();
            for (let i = 0; i < first; i++) elements.calendarDays.appendChild(Object.assign(document.createElement('div'), { className: 'calendar-day bg-gray-50/50' }));
            for (let d = 1; d <= last; d++) {
                const date = new Date(y, m, d);
                const dayEvs = events.filter(ev => date >= ev.startDate && date <= ev.endDate);
                const cell = Object.assign(document.createElement('div'), { className: `calendar-day p-2 border-r border-b border-gray-100 ${dayEvs.length > 0 ? 'has-event' : ''}` });
                cell.innerHTML = `<div class="flex justify-between font-bold text-xl">${d}${dayEvs.length > 0 ? `<span class="bg-red-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs">${dayEvs.length}</span>` : ''}</div>`;
                const list = document.createElement('div');
                dayEvs.slice(0, 2).forEach(ev => {
                    const item = Object.assign(document.createElement('div'), { className: 'text-[12px] truncate px-1 rounded border-l-4 mt-1 cursor-pointer', textContent: ev.title });
                    item.style.borderLeftColor = ev.color; item.style.backgroundColor = `${ev.color}15`;
                    item.onclick = () => showEventDetails(ev); list.appendChild(item);
                });
                cell.appendChild(list); elements.calendarDays.appendChild(cell);
            }
        }

        function renderYearCalendar(events) {
            elements.yearView.innerHTML = '';
            for (let m = 0; m < 12; m++) {
                const card = Object.assign(document.createElement('div'), { className: 'bg-white rounded-2xl p-4 shadow-sm border cursor-pointer' });
                card.onclick = () => { currentDate.setMonth(m); switchView('month'); };
                card.innerHTML = `<div class="text-center font-bold text-red-600 border-b mb-2">${thaiMonths[m]}</div>`;
                const grid = Object.assign(document.createElement('div'), { className: 'grid grid-cols-7 gap-1 text-[10px] text-center' });
                ['อ','จ','อ','พ','พฤ','ศ','ส'].forEach(d => grid.innerHTML += `<div class="text-gray-400">${d}</div>`);
                const last = new Date(currentDate.getFullYear(), m + 1, 0).getDate();
                const startDay = new Date(currentDate.getFullYear(), m, 1).getDay();
                for(let i=0; i<startDay; i++) grid.innerHTML += `<div></div>`;
                for (let d = 1; d <= last; d++) {
                    const has = events.some(ev => new Date(currentDate.getFullYear(), m, d) >= ev.startDate && new Date(currentDate.getFullYear(), m, d) <= ev.endDate);
                    grid.innerHTML += `<div class="py-1 ${has ? 'bg-yellow-400 rounded-full font-bold' : ''}">${d}</div>`;
                }
                card.appendChild(grid); elements.yearView.appendChild(card);
            }
        }

        function renderEventsList(events) {
            elements.eventsList.innerHTML = '';
            events.sort((a,b) => a.startDate - b.startDate).forEach(ev => {
                const item = Object.assign(document.createElement('div'), { className: 'event-item p-4 rounded-xl flex justify-between cursor-pointer' });
                item.onclick = () => showEventDetails(ev);
                item.innerHTML = `<div class="flex">
                    <div class="mr-4 text-center">
                        <div class="text-xs text-gray-400 font-bold">${thaiMonths[ev.startDate.getMonth()].substring(0,3)}</div>
                        <div class="text-2xl font-black text-red-600">${ev.startDate.getDate()}</div>
                    </div>
                    <div><h4 class="font-bold text-lg">${ev.title}</h4><div class="text-xs text-gray-500">${ev.department}</div></div>
                </div><div class="text-right text-sm font-bold text-gray-600">${ev.person}</div>`;
                elements.eventsList.appendChild(item);
            });
        }

        function showEventDetails(ev) {
            const cat = document.getElementById('modalCategory');
            cat.textContent = ev.department; cat.style.backgroundColor = `${ev.color}15`; cat.style.color = ev.color;
            const speakTxt = `กิจกรรม ${ev.title}. จัดขึ้นวันที่ ${ev.startDate.getDate()} ${thaiMonths[ev.startDate.getMonth()]} ${ev.startDate.getFullYear()+543}. ${ev.location ? 'สถานที่คือ ' + ev.location : ''}. ผู้รับผิดชอบคือ ${ev.person || 'ไม่ระบุ'}. ${ev.details ? 'รายละเอียดคือ ' + ev.details : ''}. ${ev.additionalInfo ? 'ข้อมูลเพิ่มเติมคือ ' + ev.additionalInfo : ''}`;
            elements.speakBtn.onclick = () => speakText(speakTxt);
            elements.modalContent.innerHTML = `<h3 class="text-3xl font-black mb-4">${ev.title}</h3>
                <div class="space-y-4">
                    <div class="font-bold flex items-center"><span class="mr-2">📅</span> ${ev.startDate.getDate()} ${thaiMonths[ev.startDate.getMonth()]} ${ev.startDate.getFullYear()+543}</div>
                    ${ev.location ? `<div class="flex items-center"><span class="mr-2">📍</span> ${ev.location}</div>` : ''}
                    <div class="flex items-center"><span class="mr-2">👤</span> ${ev.person || 'ไม่ระบุ'}</div>
                    ${ev.details ? `<div class="p-4 bg-gray-50 rounded-xl border-l-4 border-red-600"><p class="text-xs font-bold text-gray-400">รายละเอียด</p>${ev.details}</div>` : ''}
                    ${ev.additionalInfo ? `<div class="p-4 bg-yellow-50 rounded-xl border-l-4 border-yellow-400"><p class="text-xs font-bold text-yellow-600">ข้อมูลเพิ่มเติม</p>${ev.additionalInfo}</div>` : ''}
                </div>`;
            elements.modal.classList.remove('hidden');
        }

        function switchView(view) {
            currentView = view;
            elements.monthBtn.classList.toggle('tab-active', view === 'month');
            elements.yearBtn.classList.toggle('tab-active', view === 'year');
            elements.calendarView.classList.toggle('hidden', view !== 'month');
            elements.yearView.classList.toggle('hidden', view !== 'year');
            updateCalendarTitle(); filterEvents();
        }

        function updateCalendarTitle() { elements.currentPeriod.textContent = currentView === 'month' ? `${thaiMonths[currentDate.getMonth()]} ${currentDate.getFullYear()+543}` : `ปี พ.ศ. ${currentDate.getFullYear()+543}`; }
        function navigatePrevious() { if (currentView === 'month') currentDate.setMonth(currentDate.getMonth()-1); else currentDate.setFullYear(currentDate.getFullYear()-1); updateCalendarTitle(); filterEvents(); }
        function navigateNext() { if (currentView === 'month') currentDate.setMonth(currentDate.getMonth()+1); else currentDate.setFullYear(currentDate.getFullYear()+1); updateCalendarTitle(); filterEvents(); }
        window.addEventListener('load', () => { setupUI(); fetchEvents(); updateCalendarTitle(); });
    </script>
</body>
</html>
